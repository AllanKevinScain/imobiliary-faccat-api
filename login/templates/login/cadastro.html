{% extends 'base.html' %}

{% load crispy_forms_tags %}

{% block content %}

<div class="container-sm mt-5">
    <h1 class="text-center">Cadastro de Usuário</h1>
</div>

<div class="container my-3">
    <div class="row">
        <div class="col-6 mx-auto">
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}

                <button type="submit" class="btn btn-success">Cadastrar</button>

            </form>
        </div>
    </div>
</div>
{% endblock %}
