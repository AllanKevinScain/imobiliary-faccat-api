<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistema{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary px-4">
        <a class="navbar-brand" href="{% url 'core:index' %}">Dashboard</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'clientes:lista' 'nome' %}">Clientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'funcionarios:lista' 'nome' %}">Funcionarios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'imoveis:lista' 'nome' %}">Imoveis</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'imoveis:lista_reservas' 'cliente' %}">Reservas</a>
                </li>
            </ul>
        </div>
        {% include 'partials/_busca.html' %}
    </nav>


    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/imask"></script>
</body>

</html>
