{% extends 'base.html' %}

{% load crispy_forms_tags %}

{% block content %}

<div class="container-sm mt-5">
    <a href="{% url 'imoveis:lista_quartos' imovel.id %}" class="btn btn-secondary">Voltar</a>
</div>

<div class="container-sm mt-2">
    <h1 class="h1">Cadastrar quarto para o imóvel: {{ imovel.nome }}</h1>
</div>

<div class="container-sm mt-3">
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}

        <button type="submit" class="btn btn-success">Salvar</button>
    </form>
</div>

{% endblock %}
